<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172a28"><title>5MIN | DAILY TRAINING</title><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#172a28;background:#f6f7f3}*{box-sizing:border-box}body{margin:0}main{max-width:570px;margin:auto;padding:26px 18px 90px}.top{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:11px;letter-spacing:.2em;font-weight:800;color:#5e7a71}h1{font-size:33px;letter-spacing:-.05em;margin:12px 0 6px}.muted{color:#71817b;font-size:13px}.date{font-weight:700;font-size:12px}.hero{background:#172a28;color:white;padding:24px;border-radius:24px;margin:24px 0}.hero small{color:#a9c5ba;letter-spacing:.13em}.hero strong{font-size:54px;letter-spacing:-.06em;display:block;line-height:1.2}.hero p{color:#b7c9c2;margin:6px 0 18px;font-size:13px}.progress{height:7px;background:#40524e;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#c3e2ad;transition:width .2s}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:26px}.stat{background:white;border-radius:16px;padding:14px 10px;text-align:center}.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:#71817b}.section{display:flex;justify-content:space-between;align-items:center;margin:25px 0 12px}.section h2{font-size:18px;margin:0}.section span{font-size:11px;color:#81908a}.exercise{background:white;border:1px solid #e7ebe5;border-radius:19px;margin:11px 0;overflow:hidden}.exmain{display:grid;grid-template-columns:112px 1fr;gap:12px;padding:12px}.art{background:#edf2ed;border-radius:13px;min-height:105px;display:grid;place-items:center}.art svg{width:100%;height:105px}.exinfo{padding:3px 0}.num{font-size:10px;color:#6b897d;letter-spacing:.1em;font-weight:800}.exinfo h3{font-size:16px;margin:5px 0}.exinfo p{font-size:12px;color:#64736e;margin:5px 0}.target{font-size:12px;font-weight:800;color:#315b4b}.exbottom{display:flex;align-items:center;justify-content:space-between;padding:0 13px 12px;gap:10px}.details{background:none;border:none;color:#49675d;text-decoration:underline;font-size:12px;padding:8px;cursor:pointer}.check{background:#eaf0e9;border:0;border-radius:11px;padding:11px 15px;color:#284a3c;font-weight:800;cursor:pointer}.check.done{background:#234d3e;color:white}.instructions{display:none;border-top:1px solid #edf0eb;padding:13px 17px;font-size:13px;line-height:1.85;color:#53645e}.instructions.open{display:block}.instructions p{margin:0}.instructions em{display:block;font-style:normal;color:#9b6d3f;margin-top:6px}.calendar{background:white;padding:16px;border-radius:20px}.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.month button{border:0;background:#eff3ee;border-radius:10px;width:35px;height:32px;font-size:19px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;text-align:center}.days .weekday{font-size:11px;color:#8c9993}.day{border:0;background:#f5f7f3;aspect-ratio:1;border-radius:10px;color:#3c5149;font-weight:700;font-size:12px}.day.full{background:#2c5b47;color:white}.day.partial{background:#dcead8}.day.today{outline:2px solid #7c9f7c;outline-offset:1px}.day.selected{box-shadow:inset 0 0 0 2px #a1b49e}.day:disabled{opacity:.35}.footer{font-size:12px;line-height:1.7;color:#7a8881;margin-top:22px}.actions{display:flex;gap:10px;margin-top:16px}.actions button{border:1px solid #d7e0d7;border-radius:10px;background:white;padding:10px;font-size:12px;color:#49675d}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#172a28;color:white;padding:12px 18px;border-radius:40px;display:none;white-space:nowrap;font-size:13px}@media(max-width:350px){.exmain{grid-template-columns:90px 1fr}.art svg{height:90px}}
</style></head><body><main><header class="top"><div class="eyebrow">DAILY CONDITIONING</div><div class="date" id="todayLabel"></div></header><h1>5 MIN <span style="color:#7d9a86">/</span> DAY</h1><div class="muted">立ち仕事に強い体へ。姿勢も、少しずつ。</div><section class="hero"><small id="selectedLabel">TODAY'S WORKOUT</small><strong><span id="count">0</span><span style="font-size:24px;color:#a4b8ab"> / 5</span></strong><p id="heroMsg">今日の5分を、積み重ねよう。</p><div class="progress"><i id="bar"></i></div></section><div class="stats"><div class="stat"><b id="streak">0</b><span>連続達成日数</span></div><div class="stat"><b id="total">0</b><span>累計達成日数</span></div><div class="stat"><b id="monthCount">0</b><span>今月の達成日数</span></div></div><div class="section"><h2>トレーニング</h2><span>各1分・休憩込み</span></div><div id="exercises"></div><div class="section"><h2>記録カレンダー</h2><span>濃い緑 = 5種目達成</span></div><section class="calendar"><div class="month"><button id="prev" aria-label="前月">‹</button><b id="monthLabel"></b><button id="next" aria-label="次月">›</button></div><div class="days" id="days"></div></section><div class="actions"><button id="todayBtn">今日に戻る</button><button id="exportBtn">記録をCSVで保存</button></div><p class="footer">記録はこの端末のブラウザ内に保存されます。別の端末とは同期されません。ブラウザデータの削除で消える場合があるため、時々CSV保存をおすすめします。夕食後は満腹感が落ち着いてから。右手の痛み・しびれが出る動作は中止してください。ベンチは必ず安定した場所で使用してください。</p></main><div class="toast" id="toast"></div><script>
const paths=[
// calf
`<path d="M20 91H100" stroke="#a9b8a9" stroke-width="3"/><path d="M83 16V90" stroke="#91a79a" stroke-width="5"/><circle cx="47" cy="20" r="9"/><path d="M47 30L45 57L37 77L33 87M45 57L56 76L59 87M45 37L66 43L82 39"/><path d="M29 88h14M54 88h13" stroke-width="5"/><path d="M26 75l-6 -7m6 7l-8 1" stroke="#81a58b" stroke-width="2"/>`,
// knee tuck
`<path d="M12 68H105M28 68v28M95 68v28" stroke="#9aaea0" stroke-width="5"/><circle cx="47" cy="22" r="9"/><path d="M47 32L51 54L43 68M51 54L71 59L85 43M45 40L30 61L24 66"/><path d="M86 31l8 -5m-8 5l7 5" stroke="#8eae8c" stroke-width="2"/>`,
// hip thrust
`<path d="M9 61H43M16 61v35M38 61v35" stroke="#9aaea0" stroke-width="5"/><circle cx="29" cy="42" r="8"/><path d="M37 45L53 49L72 43L87 64L87 89M72 43L65 66L64 89M53 49L46 61"/><path d="M78 90h18M55 90h17" stroke-width="4"/><path d="M70 29v-14m0 0l-6 6m6 -6l6 6" stroke="#81a58b" stroke-width="2"/>`,
// reverse fly
`<path d="M24 60H96M32 60v35M90 60v35" stroke="#9aaea0" stroke-width="5"/><circle cx="26" cy="45" r="8"/><path d="M35 48L67 49L83 53M65 49L77 70L85 75M43 50L43 27L30 17M43 50L51 27L65 17"/><path d="M24 17h12M59 17h12" stroke-width="4"/>`,
// assisted hang
`<path d="M15 12H105M21 12V95M99 12V95" stroke="#9aaea0" stroke-width="5"/><circle cx="60" cy="38" r="9"/><path d="M60 48L60 71L49 90M60 71L71 90M58 52L47 31L46 12M62 52L73 31L74 12"/><path d="M40 91h15M66 91h15" stroke-width="4"/>`
];
const items=[
{name:'カーフレイズ',sub:'ふくらはぎ・足の持久力',dose:'20回',steps:'ぶら下がり健康器具の柱に軽くつかまる。かかとをゆっくり上げ、ゆっくり下ろす。反動をつけず20回。',caution:'ふらつかないよう、両足で行う。'},
{name:'ベンチ・ニータック',sub:'腹筋・体幹',dose:'10〜15回',steps:'フラットベンチの端に座り、軽く後ろに傾く。両手でベンチを支え、膝を胸の方へ引き寄せて戻す。足は低い位置で無理なく。',caution:'右手にしびれが出る場合は中止。腰を丸めすぎない。'},
{name:'ベンチ・ヒップスラスト',sub:'お尻・骨盤まわり',dose:'10〜15回',steps:'安定したベンチに肩甲骨の下あたりを当て、足を床につく。お尻を持ち上げて肩から膝をほぼ一直線にし、ゆっくり下ろす。',caution:'ベンチが滑らないよう固定。腰を反りすぎない。'},
{name:'フラット・リバースフライ',sub:'背中・猫背対策',dose:'8〜12回',steps:'フラットベンチにうつ伏せになり、腕を下に垂らす。肘を少し曲げたまま、両腕を横にゆっくり広げて戻す。重りなし。',caution:'肩をすくめず、首は自然に。肩が痛む範囲は避ける。'},
{name:'足つきぶら下がり',sub:'肩周り・姿勢リセット',dose:'10〜20秒 × 2',steps:'バーを握り、足を床につけたまま膝を少し曲げ、体重の一部だけ腕にかける。10〜20秒行い休憩してもう一度。',caution:'右手のしびれや肩の痛みが出たら行わない。'}];
const $=id=>document.getElementById(id);let records={};try{records=JSON.parse(localStorage.getItem('fiveMinRecordsV1')||'{}')}catch{}const key=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');const now=()=>new Date();let selected=key(now()),view=new Date(now().getFullYear(),now().getMonth(),1);const count=k=>(records[k]||[]).filter(Boolean).length;function save(){localStorage.setItem('fiveMinRecordsV1',JSON.stringify(records))}function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1600)}function svg(i){return `<svg viewBox="0 0 120 105" aria-hidden="true"><g fill="none" stroke="#2d5746" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">${paths[i]}</g></svg>`}
function render(){const d=new Date(selected+'T12:00:00');$('todayLabel').textContent=new Intl.DateTimeFormat('ja-JP',{month:'short',day:'numeric',weekday:'short'}).format(now());$('selectedLabel').textContent=selected===key(now())?'TODAY’S WORKOUT':selected+' の記録';$('count').textContent=count(selected);$('bar').style.width=count(selected)*20+'%';$('heroMsg').textContent=count(selected)===5?'5分達成！今日もおつかれさま。':'今日の5分を、積み重ねよう。';$('exercises').innerHTML=items.map((x,i)=>`<article class="exercise"><div class="exmain"><div class="art">${svg(i)}</div><div class="exinfo"><div class="num">0${i+1} / 05</div><h3>${x.name}</h3><div class="target">${x.dose} · 1分</div><p>${x.sub}</p></div></div><div class="exbottom"><button class="details" data-detail="${i}" aria-expanded="false">やり方を見る ↓</button><button class="check ${records[selected]?.[i]?'done':''}" data-check="${i}">${records[selected]?.[i]?'✓ 完了':'○ 完了にする'}</button></div><div class="instructions" id="detail${i}"><p>${x.steps}</p><em>注意：${x.caution}</em></div></article>`).join('');document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{const i=+b.dataset.check;records[selected]??=[false,false,false,false,false];records[selected][i]=!records[selected][i];save();render();if(count(selected)===5)toast('5分達成！おつかれさま！')});document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{const el=$('detail'+b.dataset.detail);el.classList.toggle('open');b.setAttribute('aria-expanded',el.classList.contains('open'));b.textContent=el.classList.contains('open')?'閉じる ↑':'やり方を見る ↓'});const all=Object.keys(records).filter(k=>count(k)===5).sort();$('total').textContent=all.length;$('monthCount').textContent=all.filter(k=>k.startsWith(key(now()).slice(0,7))).length;let streak=0,cursor=new Date();if(count(key(cursor))!==5)cursor.setDate(cursor.getDate()-1);while(count(key(cursor))===5){streak++;cursor.setDate(cursor.getDate()-1)}$('streak').textContent=streak;calendar()}
function calendar(){const y=view.getFullYear(),m=view.getMonth();$('monthLabel').textContent=`${y}年 ${m+1}月`;let html=['日','月','火','水','木','金','土'].map(x=>`<div class="weekday">${x}</div>`).join('');const first=new Date(y,m,1).getDay(),length=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++)html+='<div></div>';for(let day=1;day<=length;day++){const k=key(new Date(y,m,day)),n=count(k);html+=`<button class="day ${n===5?'full':n?'partial':''} ${k===key(now())?'today':''} ${k===selected?'selected':''}" data-day="${k}" ${k>key(now())?'disabled':''} aria-label="${k} ${n}種目達成">${day}</button>`}$('days').innerHTML=html;document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selected=b.dataset.day;render();window.scrollTo({top:0,behavior:'smooth'})})}
$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);calendar()};$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);calendar()};$('todayBtn').onclick=()=>{selected=key(now());view=new Date(now().getFullYear(),now().getMonth(),1);render()};$('exportBtn').onclick=()=>{const rows=['日付,カーフレイズ,ニータック,ヒップスラスト,リバースフライ,ぶら下がり,達成数'];for(const k of Object.keys(records).sort())rows.push([k,...items.map((_,i)=>records[k]?.[i]?'1':'0'),count(k)].join(','));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download='5min-training-records.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};render();if('serviceWorker'in navigator){let refreshing=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!refreshing){refreshing=true;location.reload()}});navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}).then(r=>{r.update().catch(()=>{});document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update().catch(()=>{})})}).catch(()=>{});}
</script></body></html>
